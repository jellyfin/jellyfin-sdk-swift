module: JellyfinAPI

generate:
  - entities
  - paths

dataTypes:
  integer:
    int32: Int
    int64: Int
  string:
    uuid: String

entities:
  automaticIdentifiable: true
  conformances:
    - Codable
    - Hashable
    - Sendable
  enumConformances:
    - Codable
    - CaseIterable
    - Sendable
  indirectProperties:
    - RemoteSearchResult.albumArtist
    - BaseItemDto.currentProgram
  sharedShapeTypes:
    ActivityLogEntryStartMessage: WebSocketDataMessageInfo
    ActivityLogEntryStopMessage: WebSocketMessageTypeInfo
    BaseItemDto.ImageBlurHashes: ImageBlurHashes
    BoxSetInfo: MetadataLookupInfo
    BufferRequestDto: PlaybackQueueStateInfo
    ExternalURL: NamedURL
    LocalizationOption: NameValuePair
    NameIDPair: NameIDPair
    NextItemRequestDto: PlaylistItemRequestInfo
    OutboundKeepAliveMessage: WebSocketMessageIDInfo
    PlaybackProgressInfo: PlaybackStateInfo
    PluginInstallationCancelledMessage: PluginInstallationMessageInfo
    SeriesTimerCancelledMessage: TimerMessageInfo
    SyncPlayGroupDoesNotExistUpdate: SyncPlayGroupUpdate
  sortProperties: true

paths:
  filenameTemplate: "%0API.swift"

rename:
  enumCases:
    VideoRangeType.DOVI: dovi
    VideoRangeType.DOVIWithHDR10: doviWithHDR10
    VideoRangeType.DOVIWithHLG: doviWithHLG
    VideoRangeType.DOVIWithSDR: doviWithSDR
    VideoRangeType.DOVIWithEL: doviWithEL
    VideoRangeType.DOVIWithHDR10Plus: doviWithHDR10Plus
    VideoRangeType.DOVIWithELHDR10Plus: doviWithELHDR10Plus
    VideoRangeType.DOVIInvalid: doviInvalid
    VideoRangeType.HDR10Plus: hdr10Plus
